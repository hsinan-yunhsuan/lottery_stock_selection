# 存放路徑：.github/workflows/ipo_lottery_workflow.yml
#
# 用途：平日一天跑 3 次，抓 HiStock 申購日程表，報酬率超過 20% 就推播
# 跟股價提醒那組 workflow 共用同一個 LINE Bot，Secrets 直接沿用：
#   LINE_CHANNEL_ACCESS_TOKEN
#   LINE_USER_ID

name: IPO Lottery Alert

on:
  schedule:
    # UTC 00:30 / 04:30 = 台北時間 08:30 / 12:30，週一到週五
    - cron: "30 0,4 * * 1-5"
  workflow_dispatch: {}

# 讓 GITHUB_TOKEN 有權限把狀態檔 push 回 repo
permissions:
  contents: write

jobs:
  check-ipo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas lxml

      - name: Run IPO alert script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python ipo_lottery_alert.py

      # always()：就算上一步失敗也要存檔，
      # 才能記住「今天已經發過失敗通知」以及「已經推播過的股票」
      - name: Commit updated alert state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ipo_alert_state.json
          git commit -m "update ipo alert state" || echo "no changes to commit"
          git push
