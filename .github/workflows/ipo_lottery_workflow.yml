# 存放路徑：放到你的 repo 底下的 .github/workflows/ipo_lottery_workflow.yml
#
# 用途：平日一天跑 3 次，抓 HiStock 申購日程表，報酬率超過 20% 就推播
# 跟股價提醒那組 workflow 共用同一個 LINE Bot，
# 所以 Secrets 可以直接沿用，不用重新設定：
#   LINE_CHANNEL_ACCESS_TOKEN
#   LINE_USER_ID

name: IPO Lottery Alert

on:
  schedule:
    - cron: "30 0 * * 1-5"  # 台北時間 08:30
  workflow_dispatch: {}

jobs:
  check-ipo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas lxml

      - name: Run IPO alert script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python ipo_lottery_alert.py

      - name: Commit updated alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ipo_alert_state.json
          git commit -m "update ipo alert state" || echo "no changes to commit"
          git push
